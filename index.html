<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Akini</title>
<script>
/* 入口页：清掉旧版内嵌应用遗留的 Service Worker 与缓存，然后进入最新 akini.html */
(function () {
  var jumped = false;
  function go() {
    if (jumped) return;
    jumped = true;
    location.replace("akini.html?v=20260909zb");
  }
  /* 旧版遗留 SW/缓存只在首次进新入口时清一次；之后直接跳转，避免每次进入都注销 SW 导致开屏闪两次 */
  var cleaned = false;
  try { cleaned = localStorage.getItem("__akini_entry_cleaned_v1") === "1"; } catch (e) {}
  if (cleaned) { go(); return; }
  try { localStorage.setItem("__akini_entry_cleaned_v1", "1"); } catch (e) {}
  try {
    var jobs = [];
    if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches && caches.keys) {
      jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }));
    }
    if (jobs.length) {
      Promise.all(jobs).then(go).catch(go);
      setTimeout(go, 1500);
    } else {
      go();
    }
  } catch (e) { go(); }
})();
</script>
</head>
<body></body>
</html>
