<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Akini</title>
<script>
/* 入口页：清掉旧版内嵌应用遗留的 Service Worker 与缓存，然后进入最新 akini.html */
(function () {
  var jumped = false;
  function go() {
    if (jumped) return;
    jumped = true;
    location.replace("akini.html?v=20261003v794");
  }
  /* 每次版本升级都把清理标记升级一级：老用户（已置 v1）会再次全量注销 SW 并删除所有缓存，杜绝旧版本缓存数据 */
  var cleaned = false;
  try { cleaned = localStorage.getItem("__akini_entry_cleaned_v767") === "1"; } catch (e) {}
  if (cleaned) { go(); return; }
  try { localStorage.setItem("__akini_entry_cleaned_v767", "1"); } catch (e) {}
  try {
    var jobs = [];
    if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches && caches.keys) {
      jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }));
    }
    if (jobs.length) {
      Promise.all(jobs).then(go).catch(go);
      setTimeout(go, 1500);
    } else {
      go();
    }
  } catch (e) { go(); }
})();
</script>

  <script>
    (function() {
      try {
        var savedFav = localStorage.getItem('akini_custom_favicon');
        if (savedFav) {
          var link = document.querySelector("link[rel*='icon']");
          if (!link) {
            link = document.createElement('link');
            link.rel = 'icon';
            document.head.appendChild(link);
          }
          link.href = savedFav;
        }
      } catch(e) {}
    })();
  </script>

</head>
<body></body>
</html>
